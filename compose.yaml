services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: maitre_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maitre_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
